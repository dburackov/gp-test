name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: mvn -B clean package

      - name: Start application
        run: |
          mvn -B spring-boot:run > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8092/property-view/hotels > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -50 app.log
          exit 1
